<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorting Algorithm Visualizer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="wrapper">
        <!-- Control Panel -->
        <div class="control-panel">
            <div class="controls-row">
                <div class="control-item">
                    <label>Algorithm:</label>
                    <select id="algorithmSelect">
                        <option value="cocktail">Cocktail Sort</option>
                        <option value="bubble">Bubble Sort</option>
                        <option value="insertion">Insertion Sort</option>
                        <option value="selection">Selection Sort</option>
                        <option value="quick">Quick Sort</option>
                    </select>
                </div>

                <div class="control-item">
                    <label>Compare:</label>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="compareMode" />
                        <label for="compareMode" class="checkbox-label">2 Algorithms</label>
                    </div>
                </div>

                <div class="control-item" id="algorithm2Item" style="display: none;">
                    <label>Algorithm 2:</label>
                    <select id="algorithm2Select">
                        <option value="bubble">Bubble Sort</option>
                        <option value="cocktail">Cocktail Sort</option>
                        <option value="insertion">Insertion Sort</option>
                        <option value="selection">Selection Sort</option>
                        <option value="quick">Quick Sort</option>
                    </select>
                </div>

                <div class="control-item">
                    <label>Size:</label>
                    <input type="number" id="arraySize" min="1" max="1000" value="50" />
                </div>

                <div class="control-item">
                    <label>Speed:</label>
                    <input type="range" id="speed" min="1" max="100" value="50" class="slider" />
                    <span id="speedValue">50</span>%
                </div>

                <button id="startBtn" class="btn-start">▶ START</button>
                <button id="stopBtn" class="btn-stop" style="display: none;">⏹ STOP</button>
            </div>
        </div>

        <!-- Visualization Area -->
        <div class="viz-area">
            <div id="container1" class="viz-container">
                <div class="viz-header">
                    <h3 id="algo1Name">Cocktail Sort</h3>
                    <div class="stats-row">
                        <div class="stat"><span class="label">Comparisons:</span> <span id="comp1">0</span></div>
                        <div class="stat"><span class="label">Swaps:</span> <span id="swap1">0</span></div>
                    </div>
                </div>
                <div id="barsContainer1" class="bars-container"></div>
            </div>

            <div id="container2" class="viz-container" style="display: none;">
                <div class="viz-header">
                    <h3 id="algo2Name">Bubble Sort</h3>
                    <div class="stats-row">
                        <div class="stat"><span class="label">Comparisons:</span> <span id="comp2">0</span></div>
                        <div class="stat"><span class="label">Swaps:</span> <span id="swap2">0</span></div>
                    </div>
                </div>
                <div id="barsContainer2" class="bars-container"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
